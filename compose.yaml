# Local/staging installation. Supply .env.deploy; keep it outside version control.
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: kontura
      POSTGRES_USER: kontura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontura -d kontura"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    image: kontura:${KONTURA_IMAGE_TAG:-local}
    command: ["pnpm", "db:migrate"]
    env_file: .env.deploy
    environment:
      DATABASE_URL: postgresql://kontura:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/kontura
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    image: kontura:${KONTURA_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: .env.deploy
    environment:
      DATABASE_URL: postgresql://kontura:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/kontura
      DB_MIGRATE_ON_START: "false"
      ALLOW_EMBEDDED_DB: ""
      BILLING_TEST_MODE: ""
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres:
