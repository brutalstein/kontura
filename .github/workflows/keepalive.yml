name: Keep database awake
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Supabase pauses a free project after about a week without traffic. The health check runs one query through Hyperdrive.
      # GitHub disables scheduled workflows after 60 days without repository activity; re-enable it from the Actions tab.
      - run: curl --fail --silent --show-error --max-time 30 --retry 3 https://kontura.ustacenker16.workers.dev/api/health
